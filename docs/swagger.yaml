        - LIMIT
        - WAIVER
        - AUXILIARY
      operator:
        allOf:
        - $ref: '#/definitions/policy.Operator'
        description: Operator compares a LIMIT; required for LIMIT, absent otherwise.
        enum:
        - EQ
        - NEQ
        - GT
        - GTE
        - LT
        - LTE
      policyTypeId:
        type: integer
      role:
        allOf:
        - $ref: '#/definitions/policy.Role'
        description: Role is how an AUXILIARY charge applies; required for AUXILIARY.
        enum:
        - FEE
        - DISCOUNT
        - TAX
      transactionType:
        type: string
      unitId:
        description: |-
          UnitID (units table) is what a LIMIT or WAIVER measures, or what an
          AUXILIARY cap counts; required for LIMIT and WAIVER.
        type: integer
      updatedBy:
        type: string
      value:
        example: "10000"
        type: string
      windowType:
        allOf:
        - $ref: '#/definitions/policy.WindowType'
        enum:
        - NONE
        - DAILY
        - MONTHLY
        - LIFETIME
    required:
    - kind
    - policyTypeId
    - updatedBy
    - value
    type: object
  policy.CreatePolicyTypeRequest:
    properties:
      active:
        type: boolean
      code:
        type: string
      description:
        type: string
      updatedBy:
        type: string
    required:
