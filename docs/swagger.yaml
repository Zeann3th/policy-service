      requestId:
        type: string
      reservationId:
        type: string
      responseTime:
        format: date-time
        type: string
      sender:
        $ref: '#/definitions/reservation.PartyResult'
      status:
        allOf:
        - $ref: '#/definitions/reservation.Status'
        enum:
        - RESERVED
        - REJECTED
    type: object
  reservation.Status:
    enum:
    - PROCESSING
    - RESERVED
    - RELEASED
    - REJECTED
    - FAILED
    type: string
    x-enum-varnames:
    - StatusProcessing
    - StatusReserved
    - StatusReleased
    - StatusRejected
    - StatusFailed
  unit.CreateRequest:
    properties:
      active:
        type: boolean
      code:
        example: AMOUNT
        type: string
      description:
        type: string
      updatedBy:
        example: admin
        type: string
    required:
    - code
    - updatedBy
    type: object
  unit.Response:
    properties:
      active:
        type: boolean
      code:
        example: AMOUNT
        type: string
      createdAt:
        format: date-time
        type: string
      description:
        type: string
      id:
        type: integer
      updatedAt:
        format: date-time
        type: string
    type: object
  unit.UpdateRequest:
    properties:
      active:
        type: boolean
      description:
        type: string
      updatedBy:
        example: admin
        type: string
    required:
    - active
    - updatedBy
    type: object
info:
  contact: {}
  description: Policy configuration, custom policy, unit, and cache administration
    API.
  title: Policy Service API
  version: "1.0"
paths:
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.healthResponse'
      summary: Check service health
      tags:
      - Utility
  /v1/cache/reload:
    post:
      consumes:
      - application/json
      description: Evicts one relative key or invalidates one or more cache namespaces.
        Key and namespaces are mutually exclusive.
      parameters:
      - description: Cache reload selector
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cache.ReloadRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
