        - $ref: '#/definitions/policy.Base'
        description: 'Base makes an AUXILIARY value a percentage of it; absent: flat
          amount.'
        enum:
        - AMOUNT
        - FEE
        - NET_FEE
      cap:
        description: |-
          Cap is the most an AUXILIARY policy charges per window, in its unit;
