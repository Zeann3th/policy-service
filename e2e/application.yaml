serviceName: policy-service
environment: e2e
http:
  port: "8080"
  ginMode: release
  swaggerEnabled: false
  corsOrigins:
    - http://localhost:3000
grpc:
  port: "8081"
database:
  url: postgres://policy_service:e2e_password@policy_e2e_postgres:5432/policy_service_e2e?sslmode=disable&pool_max_conns=64&pool_min_conns=16
redis:
  addrs:
    - policy_e2e_redis:6379
  password: e2e_password
  db: 0
messageBroker:
  addrs:
    - amqp://policy_service:e2e_password@policy_e2e_rabbitmq:5672/
  consumer:
    autoAck: false
    exclusive: false
    noLocal: false
    noWait: false
    requeueOnError: true
  queue:
    - name: usage-releases
      durability: true
      deleteWhenUnused: false
      exclusive: false
      noWait: false
