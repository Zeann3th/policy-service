basePath: /policy-service/api
definitions:
  cache.ReloadRequest:
    properties:
      key:
        example: policy:config:0:CU0001:VND:1
        type: string
      namespaces:
        items:
          enum:
          - all
          - units
          - policy:types
          - policy:groups
          - policies
          - policy:custom
          - policy:config
          type: string
        type: array
      updatedBy:
        example: admin
        type: string
    required:
    - updatedBy
    type: object
  cache.ReloadResponse:
    properties:
      evicted:
        type: boolean
      reloadedNamespaces:
        items:
          type: string
        type: array
    type: object
  core.ActorRequest:
    properties:
      updatedBy:
        example: admin
        type: string
    required:
    - updatedBy
    type: object
  core.AppError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  http.customPolicyPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/policy.CustomPolicyResponse'
        type: array
      limit:
        example: 20
        type: integer
      page:
        example: 1
        type: integer
      total:
        example: 1
        type: integer
    type: object
  http.healthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  http.policyGroupPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/policy.PolicyGroupResponse'
        type: array
      limit:
        example: 20
        type: integer
      page:
        example: 1
        type: integer
      total:
        example: 1
        type: integer
    type: object
  http.policyPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/policy.PolicyResponse'
        type: array
      limit:
        example: 20
        type: integer
      page:
        example: 1
        type: integer
      total:
        example: 1
        type: integer
    type: object
  http.policyTypePageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/policy.PolicyTypeResponse'
        type: array
      limit:
        example: 20
        type: integer
      page:
        example: 1
        type: integer
      total:
        example: 1
        type: integer
    type: object
  http.unitPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/unit.Response'
        type: array
      limit:
        example: 20
        type: integer
      page:
        example: 1
        type: integer
      total:
        example: 1
        type: integer
    type: object
  policy.Base:
    enum:
    - AMOUNT
    - FEE
    - NET_FEE
    type: string
    x-enum-comments:
      BaseAmount: the transaction amount
      BaseFee: the total fee
      BaseNetFee: the fee minus fee-based discounts
    x-enum-varnames:
    - BaseAmount
    - BaseFee
    - BaseNetFee
  policy.CreateCustomPolicyRequest:
    properties:
      base:
        allOf:
        - $ref: '#/definitions/policy.Base'
        description: 'Base makes an AUXILIARY value a percentage of it; absent: flat
          amount.'
        enum:
        - AMOUNT
        - FEE
        - NET_FEE
      cap:
        description: |-
          Cap is the most an AUXILIARY policy charges per window, in its unit;
          required with a window, absent otherwise.
        example: "50000"
        type: string
      channel:
        type: string
      direction:
        allOf:
        - $ref: '#/definitions/policy.Direction'
        enum:
        - ALL
        - OUT
        - IN
      effectiveFrom:
        description: EffectiveFrom defaults to now on create and is required on update.
        format: date-time
        type: string
      effectiveTo:
        format: date-time
        type: string
      isEnforced:
        description: |-
          IsEnforced false keeps the policy out of the engine: it is only
          returned as config (e.g. balance limits for accounting). Defaults to
          true on create and keeps the current value on update.
        type: boolean
      kind:
        allOf:
        - $ref: '#/definitions/policy.Kind'
        description: Kind picks the strategy that evaluates the policy.
        enum:
        - LIMIT
        - WAIVER
        - AUXILIARY
      operator:
        allOf:
        - $ref: '#/definitions/policy.Operator'
        description: Operator compares a LIMIT; required for LIMIT, absent otherwise.
        enum:
        - EQ
        - NEQ
        - GT
        - GTE
        - LT
        - LTE
      policyTypeId:
        type: integer
      reason:
        type: string
      role:
        allOf:
        - $ref: '#/definitions/policy.Role'
        description: Role is how an AUXILIARY charge applies; required for AUXILIARY.
        enum:
        - FEE
        - DISCOUNT
        - TAX
      transactionType:
        type: string
      unitId:
        description: |-
          UnitID (units table) is what a LIMIT or WAIVER measures, or what an
          AUXILIARY cap counts; required for LIMIT and WAIVER.
        type: integer
      updatedBy:
        type: string
      value:
        example: "10000"
        type: string
      windowType:
        allOf:
        - $ref: '#/definitions/policy.WindowType'
        enum:
        - NONE
        - DAILY
        - MONTHLY
        - LIFETIME
    required:
    - kind
    - policyTypeId
    - updatedBy
    - value
    type: object
  policy.CreatePolicyGroupRequest:
