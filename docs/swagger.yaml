        items:
          $ref: '#/definitions/reservation.AppliedPolicy'
        type: array
      charges:
        description: |-
          Charges is what each AUXILIARY role charges this side, in role order;
          a discount is negative. The side pays their sum.
        items:
          $ref: '#/definitions/reservation.Charge'
        type: array
      isViolated:
        type: boolean
      walletId:
        type: string
    type: object
