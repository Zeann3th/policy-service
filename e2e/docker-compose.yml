# Isolated e2e / load-test stack. It has its own Postgres, Redis and service
# so load tests never write to the dev database, and it also joins the cicd
# network (cicd_default, from cicd/docker-compose.yml) as a bridge so the
# containers share it with the dev stack.
#
# Services connect by container name (policy_e2e_*), never by service name:
# on the cicd network "postgres" / "redis" resolve to the dev containers.
#
#   docker compose -f e2e/docker-compose.yml up -d --build --wait
#   k6 run e2e/k6/load.js          (k6 runs on the host against :18080)
#
# Start the cicd stack first (docker compose -f cicd/docker-compose.yml up -d)
# so the external network exists.
name: policy-e2e

x-database: &database policy_service_e2e
x-password: &password e2e_password

services:
  postgres:
    build: ../cicd/postgres
    image: cicd-postgres:latest
    container_name: policy_e2e_postgres
    environment:
      POSTGRES_USER: policy_service
      POSTGRES_PASSWORD: *password
      POSTGRES_DB: *database
    command: >
      postgres
      -c shared_preload_libraries=pg_cron,pg_partman_bgw,pg_stat_statements
      -c cron.database_name=policy_service_e2e
      -c pg_partman_bgw.dbname=policy_service_e2e
      -c pg_partman_bgw.interval=3600
      -c max_connections=300
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c work_mem=8MB
      -c max_wal_size=4GB
      -c checkpoint_timeout=15min
      -c log_lock_waits=on
      -c deadlock_timeout=1s
      -c track_io_timing=on
    ports:
      - "55432:5432"
    shm_size: 1g
    volumes:
      - e2e_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policy_service -d policy_service_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [e2e, cicd]

  redis:
    image: redis:8
    container_name: policy_e2e_redis
    command: ["redis-server", "--requirepass", "e2e_password", "--save", "", "--appendonly", "no"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "e2e_password", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [e2e, cicd]

  rabbitmq:
    image: rabbitmq:4-alpine
    container_name: policy_e2e_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: policy_service
      RABBITMQ_DEFAULT_PASS: *password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [e2e, cicd]

  migrate:
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    image: policy-service-e2e:latest
    entrypoint: ["goose", "-dir", "/migrations", "up"]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://policy_service:e2e_password@policy_e2e_postgres:5432/policy_service_e2e?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [e2e]

  seed:
    image: cicd-postgres:latest
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/seed/seed.sql"]
    environment:
      PGHOST: policy_e2e_postgres
      PGUSER: policy_service
      PGPASSWORD: *password
      PGDATABASE: *database
    volumes:
      - ./seed:/seed:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [e2e]

  app:
    image: policy-service-e2e:latest
    container_name: policy_e2e_app
    environment:
      GOMAXPROCS: ${E2E_APP_CPUS:-4}
    volumes:
      - ./application.yaml:/app/application.yaml:ro
    ports:
      - "18080:8080"
      - "18081:8081"
    deploy:
      resources:
        limits:
          cpus: "${E2E_APP_CPUS:-4}"
          memory: 1g
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/policy-service/api/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [e2e, cicd]

volumes:
  e2e_pgdata:

networks:
  e2e: {}
  cicd:
    name: cicd_default
    external: true
