services:
  postgres:
    build: ./postgres
    container_name: policy_service_postgres
    restart: always
    environment:
      POSTGRES_USER: policy_service
      POSTGRES_PASSWORD: passratmanh123
      POSTGRES_DB: policy_service
    command: >
      postgres
      -c shared_preload_libraries=pg_cron,pg_partman_bgw
      -c cron.database_name=policy_service
      -c pg_partman_bgw.dbname=policy_service
      -c pg_partman_bgw.interval=3600
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: policy_service_redis
    restart: always
    command: ["redis-server", "--requirepass", "passratmanh123"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
