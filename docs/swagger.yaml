    properties:
      amount:
        example: "100000"
        type: string
      channel:
        example: APP
        type: string
      currency:
        example: VND
        type: string
      receiver:
        $ref: '#/definitions/reservation.PartyRequest'
      requestId:
        example: 0193a7e2-5c1f-7b3a-9d2e-1f4c5b6a7d8e
        type: string
      sender:
        $ref: '#/definitions/reservation.PartyRequest'
      transactionType:
