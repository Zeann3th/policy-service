        - AUXILIARY
      operator:
        allOf:
        - $ref: '#/definitions/policy.Operator'
        enum:
        - EQ
        - NEQ
        - GT
        - GTE
        - LT
        - LTE
      policyGroupId:
        type: integer
      policyTypeId:
        type: integer
      role:
        allOf:
        - $ref: '#/definitions/policy.Role'
        enum:
        - FEE
        - DISCOUNT
        - TAX
      transactionType:
        type: string
      unitId:
        type: integer
      updatedAt:
