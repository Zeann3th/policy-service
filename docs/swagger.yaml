        type: string
      effectiveTo:
        format: date-time
        type: string
      id:
        type: integer
      isEnforced:
        type: boolean
      kind:
        allOf:
        - $ref: '#/definitions/policy.Kind'
        enum:
        - LIMIT
        - WAIVER
        - AUXILIARY
      operator:
        allOf:
        - $ref: '#/definitions/policy.Operator'
        enum:
        - EQ
        - NEQ
        - GT
        - GTE
        - LT
        - LTE
      policyTypeId:
        type: integer
      reason:
        type: string
      role:
        allOf:
        - $ref: '#/definitions/policy.Role'
        enum:
        - FEE
        - DISCOUNT
        - TAX
      transactionType:
        type: string
      unitId:
        type: integer
      updatedAt:
        format: date-time
        type: string
      value:
        example: "10000"
        type: string
      walletId:
        type: string
      windowType:
        allOf:
        - $ref: '#/definitions/policy.WindowType'
        enum:
        - NONE
        - DAILY
        - MONTHLY
        - LIFETIME
    type: object
  policy.Direction:
    enum:
    - ALL
    - OUT
    - IN
    type: string
    x-enum-varnames:
    - DirectionAll
    - DirectionOut
    - DirectionIn
  policy.GetConfigResponse:
    properties:
