basePath: /policy-service/api
definitions:
  cache.ReloadRequest:
    properties:
      key:
        example: policy:config:0:CU0001:VND:1
        type: string
      namespaces:
        items:
          enum:
          - all
          - units
          - policy:types
          - policy:groups
          - policies
          - policy:custom
          - policy:config
          type: string
        type: array
      updatedBy:
        example: admin
        type: string
    required:
    - updatedBy
    type: object
  cache.ReloadResponse:
    properties:
      evicted:
        type: boolean
      reloadedNamespaces:
        items:
          type: string
        type: array
    type: object
  core.ActorRequest:
    properties:
      updatedBy:
        example: admin
        type: string
    required:
    - updatedBy
    type: object
  core.AppError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  http.customPolicyPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/policy.CustomPolicyResponse'
        type: array
      limit:
        example: 20
        type: integer
      page:
        example: 1
        type: integer
      total:
        example: 1
        type: integer
    type: object
  http.healthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  http.policyPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/policy.PolicyResponse'
        type: array
      limit:
        example: 20
        type: integer
      page:
        example: 1
        type: integer
      total:
        example: 1
        type: integer
    type: object
  http.policyTypePageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/policy.PolicyTypeResponse'
        type: array
      limit:
        example: 20
        type: integer
      page:
        example: 1
        type: integer
      total:
        example: 1
        type: integer
    type: object
  http.unitPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/unit.Response'
        type: array
      limit:
        example: 20
        type: integer
      page:
        example: 1
        type: integer
      total:
        example: 1
        type: integer
    type: object
  policy.CreateCustomPolicyRequest:
    properties:
      channel:
        type: string
      direction:
        allOf:
        - $ref: '#/definitions/policy.Direction'
        enum:
        - ALL
        - OUT
        - IN
      effectiveFrom:
        format: date-time
        type: string
      effectiveTo:
        format: date-time
        type: string
      operator:
        allOf:
        - $ref: '#/definitions/policy.Operator'
        enum:
        - EQ
        - NEQ
        - GT
        - GTE
        - LT
        - LTE
      policyTypeId:
        type: integer
      reason:
        type: string
      transactionType:
        type: string
      updatedBy:
        type: string
      value:
        example: "10000"
        type: string
      windowType:
        allOf:
        - $ref: '#/definitions/policy.WindowType'
        enum:
        - NONE
        - DAILY
        - MONTHLY
        - LIFETIME
    required:
    - operator
    - policyTypeId
    - updatedBy
    - value
    type: object
  policy.CreatePolicyGroupRequest:
    properties:
      currency:
        type: string
      tier:
        type: string
      updatedBy:
        type: string
      walletType:
        type: string
    required:
    - currency
    - tier
    - updatedBy
    - walletType
    type: object
  policy.CreatePolicyRequest:
    properties:
      channel:
        type: string
      direction:
        allOf:
        - $ref: '#/definitions/policy.Direction'
        enum:
        - ALL
        - OUT
        - IN
      operator:
        allOf:
        - $ref: '#/definitions/policy.Operator'
        enum:
        - EQ
        - NEQ
        - GT
        - GTE
        - LT
        - LTE
      policyTypeId:
        type: integer
      transactionType:
        type: string
      updatedBy:
        type: string
      value:
        example: "10000"
        type: string
      windowType:
        allOf:
        - $ref: '#/definitions/policy.WindowType'
        enum:
        - NONE
        - DAILY
        - MONTHLY
        - LIFETIME
    required:
    - operator
    - policyTypeId
    - updatedBy
    - value
    type: object
  policy.CreatePolicyTypeRequest:
    properties:
      active:
        type: boolean
      code:
        type: string
      description:
        type: string
      kind:
        allOf:
        - $ref: '#/definitions/policy.Kind'
        enum:
        - LIMIT
        - WAIVER
        - FEE
        - TAX
        - DISCOUNT
      unitId:
        type: integer
      updatedBy:
        type: string
    required:
    - code
    - unitId
    - updatedBy
    type: object
  policy.CustomPolicyResponse:
    properties:
      channel:
        type: string
      createdAt:
        format: date-time
        type: string
      createdBy:
        type: string
      direction:
        allOf:
        - $ref: '#/definitions/policy.Direction'
        enum:
        - ALL
        - OUT
        - IN
      effectiveFrom:
        format: date-time
        type: string
      effectiveTo:
        format: date-time
        type: string
      id:
        type: integer
      operator:
        allOf:
        - $ref: '#/definitions/policy.Operator'
        enum:
        - EQ
        - NEQ
        - GT
        - GTE
        - LT
        - LTE
      policyTypeId:
        type: integer
      reason:
        type: string
      transactionType:
        type: string
      updatedAt:
        format: date-time
        type: string
      value:
        example: "10000"
        type: string
      walletId:
        type: string
      windowType:
        allOf:
        - $ref: '#/definitions/policy.WindowType'
        enum:
        - NONE
        - DAILY
        - MONTHLY
        - LIFETIME
    type: object
  policy.Direction:
    enum:
    - ALL
    - OUT
    - IN
    type: string
    x-enum-varnames:
    - DirectionAll
    - DirectionOut
    - DirectionIn
  policy.GetConfigResponse:
    properties:
      rules:
        items:
          $ref: '#/definitions/policy.Rule'
        type: array
    type: object
  policy.Kind:
    enum:
    - LIMIT
    - WAIVER
    - FEE
    - TAX
    - DISCOUNT
    type: string
    x-enum-varnames:
    - KindLimit
    - KindWaiver
    - KindFee
    - KindTax
    - KindDiscount
  policy.Operator:
    enum:
    - EQ
    - NEQ
    - GT
    - GTE
    - LT
    - LTE
    type: string
    x-enum-varnames:
    - OpEQ
    - OpNEQ
    - OpGT
    - OpGTE
    - OpLT
    - OpLTE
  policy.PolicyGroupResponse:
    properties:
      createdAt:
        format: date-time
        type: string
      currency:
        type: string
      id:
        type: integer
      tier:
        type: string
      updatedAt:
        format: date-time
        type: string
      walletType:
        type: string
    type: object
  policy.PolicyResponse:
    properties:
      channel:
        type: string
      createdAt:
        format: date-time
        type: string
      direction:
        allOf:
        - $ref: '#/definitions/policy.Direction'
        enum:
        - ALL
        - OUT
        - IN
      id:
        type: integer
      operator:
        allOf:
        - $ref: '#/definitions/policy.Operator'
        enum:
        - EQ
        - NEQ
        - GT
        - GTE
        - LT
        - LTE
      policyGroupId:
        type: integer
      policyTypeId:
        type: integer
      transactionType:
        type: string
      updatedAt:
        format: date-time
        type: string
      value:
        example: "10000"
        type: string
      windowType:
        allOf:
        - $ref: '#/definitions/policy.WindowType'
        enum:
        - NONE
        - DAILY
        - MONTHLY
        - LIFETIME
    type: object
  policy.PolicyTypeResponse:
    properties:
      active:
        type: boolean
      code:
        type: string
      createdAt:
        format: date-time
        type: string
      description:
        type: string
      id:
        type: integer
      kind:
        allOf:
        - $ref: '#/definitions/policy.Kind'
        enum:
        - LIMIT
        - WAIVER
        - FEE
        - TAX
        - DISCOUNT
      unitId:
        type: integer
      updatedAt:
        format: date-time
        type: string
    type: object
  policy.Rule:
    properties:
      channel:
        type: string
      direction:
        allOf:
        - $ref: '#/definitions/policy.Direction'
        enum:
        - ALL
        - OUT
        - IN
      operator:
        allOf:
        - $ref: '#/definitions/policy.Operator'
        enum:
        - EQ
        - NEQ
        - GT
        - GTE
        - LT
        - LTE
      policyType:
        type: string
      source:
        allOf:
        - $ref: '#/definitions/policy.Source'
        enum:
        - SYSTEM
        - USER
      transactionType:
        type: string
      unit:
        type: string
      value:
        example: "10000"
        type: string
      windowType:
        allOf:
        - $ref: '#/definitions/policy.WindowType'
        enum:
        - NONE
        - DAILY
        - MONTHLY
        - LIFETIME
    type: object
  policy.Source:
    enum:
    - SYSTEM
    - USER
    type: string
    x-enum-varnames:
    - SourceSystem
    - SourceCustom
  policy.UpdateCustomPolicyRequest:
    properties:
      effectiveFrom:
        format: date-time
        type: string
      effectiveTo:
        format: date-time
        type: string
      operator:
        allOf:
        - $ref: '#/definitions/policy.Operator'
        enum:
        - EQ
        - NEQ
        - GT
        - GTE
        - LT
        - LTE
      reason:
        type: string
      updatedBy:
        type: string
      value:
        example: "10000"
        type: string
    required:
    - effectiveFrom
    - operator
    - updatedBy
    - value
    type: object
  policy.UpdatePolicyRequest:
    properties:
      operator:
        allOf:
        - $ref: '#/definitions/policy.Operator'
        enum:
        - EQ
        - NEQ
        - GT
        - GTE
        - LT
        - LTE
      updatedBy:
        type: string
      value:
        example: "10000"
        type: string
    required:
    - operator
    - updatedBy
    - value
    type: object
  policy.UpdatePolicyTypeRequest:
    properties:
      active:
        type: boolean
      description:
        type: string
      updatedBy:
        type: string
    required:
    - active
    - updatedBy
    type: object
  policy.WindowType:
    enum:
    - NONE
    - DAILY
    - MONTHLY
    - LIFETIME
    type: string
    x-enum-varnames:
    - WindowNone
    - WindowDaily
    - WindowMonthly
    - WindowLifetime
  reservation.AppliedPolicy:
    properties:
      channel:
        type: string
      direction:
        allOf:
        - $ref: '#/definitions/policy.Direction'
        enum:
        - ALL
        - OUT
        - IN
      kind:
        allOf:
        - $ref: '#/definitions/policy.Kind'
        enum:
        - LIMIT
        - WAIVER
        - FEE
        - TAX
        - DISCOUNT
      operator:
        allOf:
        - $ref: '#/definitions/policy.Operator'
        enum:
        - EQ
        - NEQ
        - GT
        - GTE
        - LT
        - LTE
      policyId:
        type: integer
      policyType:
        type: string
      source:
        allOf:
        - $ref: '#/definitions/policy.Source'
        enum:
        - SYSTEM
        - USER
      transactionType:
        type: string
      unit:
        type: string
      usage:
        description: Usage is the window total including this request (not stored
          when rejected).
        type: string
      value:
        type: string
      violated:
        type: boolean
      windowStart:
        example: "2026-11-23"
        type: string
      windowType:
        allOf:
        - $ref: '#/definitions/policy.WindowType'
        enum:
        - NONE
        - DAILY
        - MONTHLY
        - LIFETIME
    type: object
  reservation.PartyRequest:
    properties:
      tier:
        example: TIER_1
        type: string
      walletId:
        example: wallet-123
        type: string
      walletType:
        example: PERSONAL
        type: string
    required:
    - tier
    - walletId
    - walletType
    type: object
  reservation.PartyResult:
    properties:
      appliedPolicies:
        items:
          $ref: '#/definitions/reservation.AppliedPolicy'
        type: array
      discount:
        example: "0"
        type: string
      fee:
        example: "1100"
        type: string
      isViolated:
        type: boolean
      tax:
        example: "0"
        type: string
      walletId:
        type: string
    type: object
  reservation.ReleaseResponse:
    properties:
      requestId:
        type: string
      reservationId:
        type: string
      responseTime:
        format: date-time
        type: string
      status:
        allOf:
        - $ref: '#/definitions/reservation.Status'
        enum:
        - RELEASED
    type: object
  reservation.ReserveRequest:
    properties:
      amount:
        example: "100000"
        type: string
      channel:
        example: APP
        type: string
      currency:
        example: VND
        type: string
      receiver:
        $ref: '#/definitions/reservation.PartyRequest'
      requestId:
        example: 0193a7e2-5c1f-7b3a-9d2e-1f4c5b6a7d8e
        type: string
      sender:
        $ref: '#/definitions/reservation.PartyRequest'
      transactionType:
        example: TRANSFER
        type: string
    required:
    - amount
    - currency
    - receiver
    - requestId
    - sender
    - transactionType
    type: object
  reservation.ReserveResponse:
    properties:
      receiver:
        $ref: '#/definitions/reservation.PartyResult'
      requestId:
        type: string
      reservationId:
        type: string
      responseTime:
        format: date-time
        type: string
      sender:
        $ref: '#/definitions/reservation.PartyResult'
      status:
        allOf:
        - $ref: '#/definitions/reservation.Status'
        enum:
        - RESERVED
        - REJECTED
    type: object
  reservation.Status:
    enum:
    - PROCESSING
    - RESERVED
    - RELEASED
    - REJECTED
    - FAILED
    type: string
    x-enum-varnames:
    - StatusProcessing
    - StatusReserved
    - StatusReleased
    - StatusRejected
    - StatusFailed
  unit.CreateRequest:
    properties:
      active:
        type: boolean
      code:
        example: AMOUNT
        type: string
      updatedBy:
        example: admin
        type: string
    required:
    - code
    - updatedBy
    type: object
  unit.Response:
    properties:
      active:
        type: boolean
      code:
        example: AMOUNT
        type: string
      createdAt:
        format: date-time
        type: string
      id:
        type: integer
      updatedAt:
        format: date-time
        type: string
    type: object
  unit.UpdateRequest:
    properties:
      active:
        type: boolean
      updatedBy:
        example: admin
        type: string
    required:
    - active
    - updatedBy
    type: object
info:
  contact: {}
  description: Policy configuration, custom policy, unit, and cache administration
    API.
  title: Policy Service API
  version: "1.0"
paths:
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.healthResponse'
      summary: Check service health
      tags:
      - Utility
  /v1/cache/reload:
    post:
      consumes:
      - application/json
      description: Evicts one relative key or invalidates one or more cache namespaces.
        Key and namespaces are mutually exclusive.
      parameters:
      - description: Cache reload selector
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cache.ReloadRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cache.ReloadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core.AppError'
      summary: Reload cached data
      tags:
      - Cache
  /v1/policies:
    get:
      description: Returns active system policies merged with active wallet-specific
        overrides. An override replaces only an exact policy type, transaction type,
        channel, direction, and window type match.
      parameters:
      - description: Wallet type
        in: query
        name: walletType
        required: true
        type: string
      - description: ISO 4217 currency
        in: query
        maxLength: 3
        minLength: 3
        name: currency
        required: true
        type: string
      - description: Tier
        in: query
        name: tier
        required: true
        type: string
      - description: Wallet ID
        in: query
        name: walletId
        required: true
        type: string
      - description: Transaction type filter; ALL policies remain included
        in: query
        name: transactionType
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/policy.GetConfigResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.AppError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core.AppError'
      summary: Resolve effective policies
      tags:
      - Policy Resolution
  /v1/policies/custom/{walletId}:
    get:
      parameters:
      - description: Wallet ID
        in: path
        name: walletId
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.customPolicyPageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core.AppError'
      summary: List custom wallet policies
      tags:
      - Custom Policies
    post:
      consumes:
      - application/json
      parameters:
      - description: Wallet ID
        in: path
        name: walletId
        required: true
        type: string
      - description: Custom policy
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/policy.CreateCustomPolicyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/policy.CustomPolicyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.AppError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core.AppError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/core.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core.AppError'
      summary: Create a custom wallet policy
      tags:
      - Custom Policies
  /v1/policies/custom/{walletId}/{customPolicyId}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: Wallet ID
        in: path
        name: walletId
        required: true
        type: string
      - description: Custom policy ID
        in: path
        minimum: 1
        name: customPolicyId
        required: true
        type: integer
      - description: Audit actor
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/core.ActorRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.AppError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core.AppError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/core.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core.AppError'
      summary: Delete a custom wallet policy
      tags:
      - Custom Policies
    get:
      parameters:
      - description: Wallet ID
        in: path
        name: walletId
        required: true
        type: string
      - description: Custom policy ID
        in: path
        minimum: 1
        name: customPolicyId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/policy.CustomPolicyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.AppError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core.AppError'
      summary: Get a custom wallet policy
      tags:
      - Custom Policies
    put:
      consumes:
      - application/json
      description: Wallet, policy type, transaction type, channel, direction, window
        type, and creator are immutable.
      parameters:
      - description: Wallet ID
        in: path
        name: walletId
        required: true
        type: string
      - description: Custom policy ID
        in: path
        minimum: 1
        name: customPolicyId
        required: true
        type: integer
      - description: Mutable custom policy fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/policy.UpdateCustomPolicyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/policy.CustomPolicyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.AppError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core.AppError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/core.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core.AppError'
      summary: Update a custom wallet policy
      tags:
      - Custom Policies
  /v1/policies/groups:
    post:
      consumes:
      - application/json
      parameters:
      - description: Policy group
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/policy.CreatePolicyGroupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/policy.PolicyGroupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.AppError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/core.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core.AppError'
      summary: Create a policy group
      tags:
      - Policy Groups
  /v1/policies/groups/{groupId}:
    delete:
      consumes:
      - application/json
      description: Deletes the group and its configured policies.
      parameters:
      - description: Policy group ID
        in: path
        minimum: 1
        name: groupId
        required: true
        type: integer
      - description: Audit actor
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/core.ActorRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.AppError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core.AppError'
        "409":
