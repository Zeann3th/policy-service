syntax = "proto3";

package policy.ui.grpc;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/zeann3th/policy-service/internal/application/grpc/codegen;grpc";

service PolicyTypeService {
  rpc CreatePolicyType(CreatePolicyTypeRequest) returns (PolicyType);
  rpc GetPolicyType(IdRequest) returns (PolicyType);
  rpc ListPolicyTypes(PageRequest) returns (PolicyTypePage);
  rpc UpdatePolicyType(UpdatePolicyTypeRequest) returns (PolicyType);
  rpc DeletePolicyType(DeleteByIdRequest) returns (DeleteResponse);
}

service PolicyGroupService {
  rpc CreatePolicyGroup(CreatePolicyGroupRequest) returns (PolicyGroup);
  rpc GetPolicyGroup(IdRequest) returns (PolicyGroup);
  rpc ListPolicyGroups(PageRequest) returns (PolicyGroupPage);
  rpc DeletePolicyGroup(DeleteByIdRequest) returns (DeleteResponse);
}

service PolicyService {
  rpc GetPolicyConfig(GetPolicyConfigRequest) returns (GetPolicyConfigResponse);
  rpc CreatePolicy(CreatePolicyRequest) returns (Policy);
  rpc GetPolicy(ScopedIdRequest) returns (Policy);
  rpc ListPolicies(ScopedPageRequest) returns (PolicyPage);
  rpc UpdatePolicy(UpdatePolicyRequest) returns (Policy);
  rpc DeletePolicy(DeleteScopedRequest) returns (DeleteResponse);
  rpc CreateCustomPolicy(CreateCustomPolicyRequest) returns (CustomPolicy);
  rpc GetCustomPolicy(WalletIdRequest) returns (CustomPolicy);
  rpc ListCustomPolicies(WalletPageRequest) returns (CustomPolicyPage);
  rpc UpdateCustomPolicy(UpdateCustomPolicyRequest) returns (CustomPolicy);
  rpc DeleteCustomPolicy(DeleteCustomPolicyRequest) returns (DeleteResponse);
}

service CacheService {
  rpc ReloadCache(ReloadCacheRequest) returns (ReloadCacheResponse);
}

service ReservationService {
  rpc Reserve(ReserveRequest) returns (ReserveResponse);
  rpc Release(ReleaseRequest) returns (ReleaseResponse);
}

// Evaluates a transaction like Reserve against live usage; saves nothing.
service DryRunService {
  rpc DryRun(DryRunRequest) returns (DryRunResponse);
}

message PageRequest {
  int32 page = 1;
  int32 limit = 2;
}
message IdRequest {
  uint64 id = 1;
}
message DeleteByIdRequest {
  uint64 id = 1;
  string updated_by = 2;
}
message ScopedIdRequest {
  uint64 parent_id = 1;
  uint64 id = 2;
}
message ScopedPageRequest {
  uint64 parent_id = 1;
  int32 page = 2;
  int32 limit = 3;
}
message DeleteScopedRequest {
  uint64 parent_id = 1;
  uint64 id = 2;
  string updated_by = 3;
}
message WalletIdRequest {
  string wallet_id = 1;
  uint64 id = 2;
}
message WalletPageRequest {
  string wallet_id = 1;
  int32 page = 2;
  int32 limit = 3;
}
message DeleteCustomPolicyRequest {
  string wallet_id = 1;
  uint64 id = 2;
  string updated_by = 3;
}
message DeleteResponse {}

message GetPolicyConfigRequest {
  string wallet_type = 1;
  string currency = 2;
  string tier = 3;
  string wallet_id = 4;
  string transaction_type = 5;
}
message PolicyRule {
  string policy_type = 1;
  string unit = 2;
  string transaction_type = 3;
  string channel = 4;
  string operator = 5;
  string value = 6;
  string source = 7;
  string direction = 8;
  string window_type = 9;
  string base = 10;
  string kind = 11;
}
message GetPolicyConfigResponse {
  repeated PolicyRule rules = 1;
}

message PolicyType {
  uint64 id = 1;
  string code = 2;
  optional string description = 3;
  reserved 4, 10;
  reserved "unit_id", "base";
  bool active = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  string kind = 8;
  reserved 9;
  reserved "window_type";
}
message PolicyTypePage {
  repeated PolicyType items = 1;
  int32 page = 2;
  int32 limit = 3;
  int64 total = 4;
}
message CreatePolicyTypeRequest {
  string code = 1;
  optional string description = 2;
  reserved 3, 8;
  reserved "unit_id", "base";
  optional bool active = 4;
  string updated_by = 5;
  string kind = 6;
  reserved 7;
  reserved "window_type";
}
message UpdatePolicyTypeRequest {
  uint64 id = 1;
  optional string description = 2;
  optional bool active = 3;
  string updated_by = 4;
}

message PolicyGroup {
  uint64 id = 1;
  string wallet_type = 2;
  string currency = 3;
  string tier = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}
message PolicyGroupPage {
  repeated PolicyGroup items = 1;
  int32 page = 2;
  int32 limit = 3;
  int64 total = 4;
}
message CreatePolicyGroupRequest {
  string wallet_type = 1;
  string currency = 2;
  string tier = 3;
  string updated_by = 4;
}

message Policy {
  uint64 id = 1;
  uint64 policy_group_id = 2;
  uint64 policy_type_id = 3;
  string transaction_type = 4;
  string channel = 5;
  string operator = 6;
  string value = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string direction = 10;
  string window_type = 11;
  google.protobuf.Timestamp effective_from = 12;
  google.protobuf.Timestamp effective_to = 13;
  string unit = 14;
  string base = 15;
}
message PolicyPage {
  repeated Policy items = 1;
  int32 page = 2;
  int32 limit = 3;
  int64 total = 4;
}
message CreatePolicyRequest {
  uint64 group_id = 1;
  uint64 policy_type_id = 2;
  string transaction_type = 3;
  string channel = 4;
  string operator = 5;
  string value = 6;
  string updated_by = 7;
  string direction = 8;
  string window_type = 9;
  google.protobuf.Timestamp effective_from = 10;
  google.protobuf.Timestamp effective_to = 11;
  string unit = 12;
  string base = 13;
}
message UpdatePolicyRequest {
  uint64 group_id = 1;
  uint64 id = 2;
  string operator = 3;
  string value = 4;
  string updated_by = 5;
  google.protobuf.Timestamp effective_from = 6;
  google.protobuf.Timestamp effective_to = 7;
  string base = 8;
}

message CustomPolicy {
  uint64 id = 1;
  string wallet_id = 2;
  uint64 policy_type_id = 3;
  string transaction_type = 4;
  string channel = 5;
  string operator = 6;
  string value = 7;
  google.protobuf.Timestamp effective_from = 8;
  google.protobuf.Timestamp effective_to = 9;
  optional string reason = 10;
  string created_by = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  string direction = 14;
  string window_type = 15;
  string unit = 16;
  string base = 17;
}
message CustomPolicyPage {
  repeated CustomPolicy items = 1;
  int32 page = 2;
  int32 limit = 3;
  int64 total = 4;
}
message CreateCustomPolicyRequest {
  string wallet_id = 1;
  uint64 policy_type_id = 2;
  string transaction_type = 3;
  string channel = 4;
  string operator = 5;
  string value = 6;
  google.protobuf.Timestamp effective_from = 7;
  google.protobuf.Timestamp effective_to = 8;
  optional string reason = 9;
  string updated_by = 10;
  string direction = 11;
  string window_type = 12;
  string unit = 13;
  string base = 14;
}
message UpdateCustomPolicyRequest {
  string wallet_id = 1;
  uint64 id = 2;
  string operator = 3;
  string value = 4;
  google.protobuf.Timestamp effective_from = 5;
  google.protobuf.Timestamp effective_to = 6;
  optional string reason = 7;
  string updated_by = 8;
  string base = 9;
}

message ReloadCacheRequest {
  string key = 1;
  repeated string namespaces = 2;
  string updated_by = 3;
}
message ReloadCacheResponse {
  bool evicted = 1;
  repeated string reloaded_namespaces = 2;
}

message ReservationParty {
  string wallet_id = 1;
  string wallet_type = 2;
  string tier = 3;
}
message ReserveRequest {
  string request_id = 1;
  string transaction_type = 2;
  string channel = 3;
  string currency = 4;
  string amount = 5;
  ReservationParty sender = 6;
  ReservationParty receiver = 7;
}
message AppliedPolicy {
  uint64 policy_id = 1;
  string policy_type = 2;
  string kind = 3;
  string unit = 4;
  string source = 5;
  string transaction_type = 6;
  string channel = 7;
  string direction = 8;
  string window_type = 9;
  string window_start = 10;
  string operator = 11;
  string value = 12;
  optional string usage = 13;
  bool violated = 14;
  string base = 15;
  optional string charge = 16;
}
message PartyResult {
  string wallet_id = 1;
  bool is_violated = 2;
  string fee = 3;
  string discount = 4;
  string tax = 5;
  repeated AppliedPolicy applied_policies = 6;
}
message ReserveResponse {
  string reservation_id = 1;
  string request_id = 2;
  string status = 3;
  PartyResult sender = 4;
  PartyResult receiver = 5;
  google.protobuf.Timestamp response_time = 6;
}
message DryRunRequest {
  string transaction_type = 1;
  string channel = 2;
  string currency = 3;
  string amount = 4;
  ReservationParty sender = 5;
  ReservationParty receiver = 6;
  // usage before this transaction by policy id, replacing the live value
  map<uint64, string> sender_usage = 7;
  map<uint64, string> receiver_usage = 8;
}
message DryRunUsage {
  uint64 policy_id = 1;
  string window_start = 2;
  string live = 3;
  string used = 4;
  bool overridden = 5;
}
message DryRunSide {
  PartyResult result = 1;
  repeated DryRunUsage usage = 2;
}
message DryRunResponse {
  string status = 1;
  DryRunSide sender = 2;
  DryRunSide receiver = 3;
  google.protobuf.Timestamp evaluated_at = 4;
}
message ReleaseRequest {
  string request_id = 1;
}
message ReleaseResponse {
  string reservation_id = 1;
  string request_id = 2;
  string status = 3;
  google.protobuf.Timestamp response_time = 4;
}
