syntax = "proto3";

package policy.ui.grpc;
option go_package = "github.com/zeann3th/policy-service/internal/application/grpc/codegen;grpc";

import "google/protobuf/timestamp.proto";

service LimitService {
  rpc GetLimitConfig(GetLimitConfigRequest) returns (GetLimitConfigResponse);
  rpc CreateUnit(CreateUnitRequest) returns (Unit);
  rpc GetUnit(IdRequest) returns (Unit);
  rpc ListUnits(PageRequest) returns (UnitPage);
  rpc UpdateUnit(UpdateUnitRequest) returns (Unit);
  rpc DeleteUnit(DeleteByIdRequest) returns (DeleteResponse);
  rpc CreateLimitType(CreateLimitTypeRequest) returns (LimitType);
  rpc GetLimitType(IdRequest) returns (LimitType);
  rpc ListLimitTypes(PageRequest) returns (LimitTypePage);
  rpc UpdateLimitType(UpdateLimitTypeRequest) returns (LimitType);
  rpc DeleteLimitType(DeleteByIdRequest) returns (DeleteResponse);
  rpc CreateLimitGroup(CreateLimitGroupRequest) returns (LimitGroup);
  rpc GetLimitGroup(IdRequest) returns (LimitGroup);
  rpc DeleteLimitGroup(DeleteByIdRequest) returns (DeleteResponse);
  rpc CreateLimitValue(CreateLimitValueRequest) returns (LimitValue);
  rpc GetLimitValue(ScopedIdRequest) returns (LimitValue);
  rpc ListLimitValues(ScopedPageRequest) returns (LimitValuePage);
  rpc UpdateLimitValue(UpdateLimitValueRequest) returns (LimitValue);
  rpc DeleteLimitValue(DeleteScopedRequest) returns (DeleteResponse);
  rpc CreateUserLimit(CreateUserLimitRequest) returns (UserLimit);
  rpc GetUserLimit(WalletIdRequest) returns (UserLimit);
  rpc ListUserLimits(WalletPageRequest) returns (UserLimitPage);
  rpc UpdateUserLimit(UpdateUserLimitRequest) returns (UserLimit);
  rpc DeleteUserLimit(DeleteUserLimitRequest) returns (DeleteResponse);
}

message PageRequest { int32 page = 1; int32 limit = 2; }
message IdRequest { uint64 id = 1; }
message DeleteByIdRequest { uint64 id = 1; string updated_by = 2; }
message ScopedIdRequest { uint64 parent_id = 1; uint64 id = 2; }
message ScopedPageRequest { uint64 parent_id = 1; int32 page = 2; int32 limit = 3; }
message DeleteScopedRequest { uint64 parent_id = 1; uint64 id = 2; string updated_by = 3; }
message WalletIdRequest { string wallet_id = 1; uint64 id = 2; }
message WalletPageRequest { string wallet_id = 1; int32 page = 2; int32 limit = 3; }
message DeleteUserLimitRequest { string wallet_id = 1; uint64 id = 2; string updated_by = 3; }
message DeleteResponse {}

message GetLimitConfigRequest { string wallet_type = 1; string currency = 2; string tier = 3; string wallet_id = 4; string transaction_type = 5; }
message LimitRule { string limit_type = 1; string unit = 2; string transaction_type = 3; string channel = 4; string operator = 5; string value = 6; string source = 7; }
message GetLimitConfigResponse { repeated LimitRule rules = 1; }

message Unit { uint64 id = 1; string code = 2; bool active = 3; google.protobuf.Timestamp created_at = 4; google.protobuf.Timestamp updated_at = 5; }
message UnitPage { repeated Unit items = 1; int32 page = 2; int32 limit = 3; int64 total = 4; }
message CreateUnitRequest { string code = 1; optional bool active = 2; string updated_by = 3; }
message UpdateUnitRequest { uint64 id = 1; optional bool active = 2; string updated_by = 3; }

message LimitType { uint64 id = 1; string code = 2; optional string description = 3; uint64 unit_id = 4; bool active = 5; google.protobuf.Timestamp created_at = 6; google.protobuf.Timestamp updated_at = 7; }
message LimitTypePage { repeated LimitType items = 1; int32 page = 2; int32 limit = 3; int64 total = 4; }
message CreateLimitTypeRequest { string code = 1; optional string description = 2; uint64 unit_id = 3; optional bool active = 4; string updated_by = 5; }
message UpdateLimitTypeRequest { uint64 id = 1; optional string description = 2; optional bool active = 3; string updated_by = 4; }

message LimitGroup { uint64 id = 1; string wallet_type = 2; string currency = 3; string tier = 4; google.protobuf.Timestamp created_at = 5; google.protobuf.Timestamp updated_at = 6; }
message CreateLimitGroupRequest { string wallet_type = 1; string currency = 2; string tier = 3; string updated_by = 4; }

message LimitValue { uint64 id = 1; uint64 limit_group_id = 2; uint64 limit_type_id = 3; string transaction_type = 4; string channel = 5; string operator = 6; string value = 7; google.protobuf.Timestamp created_at = 8; google.protobuf.Timestamp updated_at = 9; }
message LimitValuePage { repeated LimitValue items = 1; int32 page = 2; int32 limit = 3; int64 total = 4; }
message CreateLimitValueRequest { uint64 group_id = 1; uint64 limit_type_id = 2; string transaction_type = 3; string channel = 4; string operator = 5; string value = 6; string updated_by = 7; }
message UpdateLimitValueRequest { uint64 group_id = 1; uint64 id = 2; string operator = 3; string value = 4; string updated_by = 5; }

message UserLimit { uint64 id = 1; string wallet_id = 2; uint64 limit_type_id = 3; string transaction_type = 4; string channel = 5; string operator = 6; string value = 7; google.protobuf.Timestamp effective_from = 8; google.protobuf.Timestamp effective_to = 9; optional string reason = 10; string created_by = 11; google.protobuf.Timestamp created_at = 12; google.protobuf.Timestamp updated_at = 13; }
message UserLimitPage { repeated UserLimit items = 1; int32 page = 2; int32 limit = 3; int64 total = 4; }
message CreateUserLimitRequest { string wallet_id = 1; uint64 limit_type_id = 2; string transaction_type = 3; string channel = 4; string operator = 5; string value = 6; google.protobuf.Timestamp effective_from = 7; google.protobuf.Timestamp effective_to = 8; optional string reason = 9; string updated_by = 10; }
message UpdateUserLimitRequest { string wallet_id = 1; uint64 id = 2; string operator = 3; string value = 4; google.protobuf.Timestamp effective_from = 5; google.protobuf.Timestamp effective_to = 6; optional string reason = 7; string updated_by = 8; }
