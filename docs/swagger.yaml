    type: object
  policy.Kind:
    enum:
    - LIMIT
    - WAIVER
    - AUXILIARY
    type: string
    x-enum-comments:
      KindAuxiliary: 'charges: fee, discount, tax, by role'
      KindLimit: blocks a transaction that breaks a bound
      KindWaiver: waives the fee while usage is under a bound
    x-enum-varnames:
    - KindLimit
    - KindWaiver
    - KindAuxiliary
  policy.Operator:
    enum:
    - EQ
    - NEQ
    - GT
    - GTE
    - LT
